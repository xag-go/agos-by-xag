name: Bug report
description: Something in AGOS does not work as it should.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting. Please remove keys, tokens and personal data from anything you paste.
        Before you report: docs/troubleshooting.md has the common problems (install, web page, model, updates, backups, the cage) with their fixes.
        Security problems: do not use this form, see SECURITY.md (Security tab → Report a vulnerability).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The shortest list of steps that shows the problem.
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux (Ubuntu 24.04)
        - Linux (Ubuntu 22.04)
        - Linux (other)
        - macOS (Lima VM)
        - Windows (WSL 2)
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: AGOS version
      description: Paste the output of `agos version`.
      render: text
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Error code
      description: Optional. The code of the error message, if it showed one (for example `not_found` or `HERMES_TIMEOUT`; docs/errors.md says what each means).
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Optional but very helpful. Settings → Errors → Copy diagnostics (or `agos doctor --bundle` on the server, docs/troubleshooting.md "Asking for help"), pasted here. It holds no keys and no personal content; read it before posting.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Optional. The relevant lines from `agos logs` (core, web or a workspace).
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Drag images here.
