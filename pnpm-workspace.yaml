packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Supply-chain protection: refuse package versions published less than
# 3 days ago (in minutes). Most malicious releases are caught within that window.
minimumReleaseAge: 4320

# Install scripts are blocked by default in pnpm 10. Only packages listed
# here may run them — review before adding anything.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Security floors for transitive packages (pnpm audit --prod must stay clean).
overrides:
  source-map-js: ">=1.2.2"
  # Dev tools only (eslint, openapi-typescript, lighthouse): GHSA-g3hv-75wg-m249
  # (minimatch < 11.0.1) and GHSA-3g3m-2fjr-6pw4 (glob 9 - 14.0.1) have no backport.
  # The 3.x/5.x users (eslint 9 + plugins, redocly) call minimatch as a function: they
  # get minimatch 11 behind that old API (packages/minimatch-compat).
  "minimatch@<9": "link:./packages/minimatch-compat"
  "minimatch@>=9 <11.0.1": ">=11.0.1"
  glob: ">=14.0.2"
